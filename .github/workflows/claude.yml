# Automatic Claude review of each pull request into develop or main, against the review-checklist skill.
# Uses the Claude subscription token in the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`).
# Skips draft pull requests and pull requests from forks (secrets are not available there).
name: Claude review

on:
  pull_request:
    branches: [develop, main]
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request with the checklist in .claude/skills/review-checklist/SKILL.md (correctness,
            tests, readability, security basics, scope) and the rules in CLAUDE.md. Read the linked ticket in
            practice/tally/tickets/ when the branch name names one.

            Put each finding as an inline comment on the line it concerns, with its severity (blocker, major, minor,
            nit) and a concrete fix. End with one top-level comment: a short verdict and the findings by severity.
            Do not approve or request changes, and do not push commits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
