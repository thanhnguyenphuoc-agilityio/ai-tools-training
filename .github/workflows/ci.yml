# CI for the training app: typecheck, unit/API tests and e2e on pull requests and on develop/main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: practice/tally

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: practice/tally/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:hooks

  e2e:
    needs: test
    runs-on: ubuntu-24.04
    # Chromium, its system packages and fonts come with the image. Keep the tag equal to the @playwright/test
    # version in package-lock.json (checked by tests/unit/ciPlaywrightImage.test.ts).
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: practice/tally/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: practice/tally/test-results/
          retention-days: 7
