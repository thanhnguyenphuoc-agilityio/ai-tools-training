# CI for the training app. Runs on merge requests and on develop/main.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"

variables:
  APP_DIR: practice/tally
  npm_config_cache: $CI_PROJECT_DIR/.npm

stages: [check, e2e]

.npm:
  cache:
    key:
      files: [practice/tally/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd "$APP_DIR"
    - npm ci --prefer-offline --no-audit --no-fund

test:
  stage: check
  image: node:22-bookworm
  extends: .npm
  script:
    - npm run typecheck
    - npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
  artifacts:
    when: always
    reports:
      junit: $APP_DIR/test-results/vitest.xml

e2e:
  stage: e2e
  # Keep the tag in step with @playwright/test in package.json.
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  extends: .npm
  variables:
    CI: "true"
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - $APP_DIR/test-results/
    reports:
      junit: $APP_DIR/test-results/junit.xml
    expire_in: 1 week
